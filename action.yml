name: Dash temporary build access
description: Obtain temporary access to selected private flakes and Nix cache namespaces through GitHub OIDC
inputs:
  service-url:
    description: Reviewed HTTPS service origin and OIDC audience
    required: true
  flakes:
    description: JSON map of source names to expected repository, repository_id and owner_id; empty means no source access
    default: "{}"
  caches:
    description: JSON map of cache names to expected url, public_key and access (read or read-write); empty means no cache access
    default: "{}"
  github-token:
    description: Runtime workflow token used only to verify private pull-request origin
    default: ${{ github.token }}
outputs:
  cache-urls:
    description: Authenticated cache URLs, separated by newlines
  cache-expires-at:
    description: Cache credential expiration in UTC, when issued
  github-expires-at:
    description: Earliest private-source credential expiration in UTC, when issued
  cache-client:
    description: Bundled dash-cache executable; push also requires attic on PATH
runs:
  using: node24
  main: main.mjs
  post: post.mjs
  post-if: always()
