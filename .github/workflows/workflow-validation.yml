name: Workflow validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  workflows:
    name: Workflow validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31
      - name: Validate workflow syntax and expressions
        run: nix run github:NixOS/nixpkgs/6dadaf4375be35033e1c84395adbd53ff5fded96#actionlint -- -shellcheck=""
