name: Install verified Nix
description: Verify the installer release and install upstream Nix with the Determinate Systems action
runs:
  using: composite
  steps:
    - name: Download and verify Nix installer v3.24.1
      id: installer
      shell: bash
      run: |
        set -euo pipefail
        case "$RUNNER_OS/$RUNNER_ARCH" in
          Linux/X64)
            platform=x86_64-linux
            checksum=c3866cc8ed9cf64546e77b5791160a87ec628467b17cd2746d3b2ed258262df6
            ;;
          Linux/ARM64)
            platform=aarch64-linux
            checksum=652296324c3a21f19666defb31e8b390fc42ffbd4f7237c05bb067638b630d14
            ;;
          macOS/ARM64)
            platform=aarch64-darwin
            checksum=34199f983d1a08e76a4fb33b28691faa637fc4a8677b4de20bd951126e1bdada
            ;;
          *) echo "Unsupported Nix installer platform: $RUNNER_OS/$RUNNER_ARCH" >&2; exit 1 ;;
        esac
        installer="$RUNNER_TEMP/nix-installer-$platform"
        curl --proto '=https' --proto-redir '=https' --tlsv1.2 --fail --silent --show-error --location --retry 3 \
          "https://github.com/DeterminateSystems/nix-installer/releases/download/v3.24.1/nix-installer-$platform" \
          --output "$installer"
        printf '%s  %s\n' "$checksum" "$installer" | shasum -a 256 --check
        chmod +x "$installer"
        printf 'path=%s\n' "$installer" >> "$GITHUB_OUTPUT"
    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      with:
        determinate: false
        # Do not persist the implicit workflow token in Nix's configuration.
        github-token: ""
        source-binary: ${{ steps.installer.outputs.path }}
    - name: Verify Nix has no saved access tokens
      shell: bash
      run: |
        set -euo pipefail
        nix config show --json | python3 -c '
        import json, sys
        if json.load(sys.stdin)["access-tokens"]["value"]:
            raise SystemExit("Nix must not retain access tokens on this runner")
        '
